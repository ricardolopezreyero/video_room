<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tu monedero — Video Room</title>
<link rel="preload" href="/fonts/plus-jakarta-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/og-default.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/veloz.js"></script>
</head>
<body class="app-shell">
<nav class="nav">
  <a class="logo" href="/"><span>Video Room</span></a>
  <div style="display:flex; align-items:center; gap:10px;">
    <button class="icon-btn" id="btn-copy-link-nav" title="Copiar link de tu sala" aria-label="Copiar link de tu sala" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
    </button>
    <a href="#" id="btn-transmit-nav" style="display:none;"><button class="btn-primary nav-cta">🔴 Transmitir</button></a>
    <div class="bell-wrap" id="bell-wrap" style="display:none;">
      <button class="icon-btn" id="btn-bell" title="Notificaciones" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="bell-badge" id="bell-badge"></span>
      </button>
      <div class="bell-dropdown" id="bell-dropdown"></div>
    </div>
    <div class="user-chip" id="user-chip" style="display:none;">
      <img class="user-avatar" id="user-avatar" src="" alt="" onerror="this.style.visibility='hidden'">
      <span class="user-name" id="user-name"></span>
      <button class="icon-btn" id="btn-logout" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
      </button>
    </div>
  </div>
</nav>
<div class="app-subnav">
  <a href="/">Inicio</a>
  <a href="/app/estadisticas">Estadísticas</a>
  <a href="/app/transacciones">Transacciones</a>
  <a href="/app/faq">FAQ</a>
</div>
<div class="app-wrap" id="app">
  <h1>Tu monedero</h1>
  <div id="content">Cargando…</div>
</div>
<div class="app-toast" id="app-toast"></div>
<script>
function showToast(msg, ms) {
  const el = document.getElementById('app-toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms || 3200);
}

function animateBalance(el, fromCents, toCents, duration) {
  duration = duration || 1000;
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = Math.round((fromCents + (toCents - fromCents) * eased) / 100);
    el.textContent = '$' + val.toLocaleString('es-MX');
    if (t < 1) requestAnimationFrame(tick);
    else el.textContent = '$' + Math.round(toCents / 100).toLocaleString('es-MX');
  }
  requestAnimationFrame(tick);
}

// Ráfaga de billetes al retirar con éxito — mismo lenguaje visual que los
// corazones flotantes de la sala en vivo, adaptado aquí para el momento de
// cobrar de verdad.
function spawnFloatingCash() {
  const cash = document.createElement('div');
  cash.className = 'floating-cash';
  cash.textContent = '💵';
  cash.style.left = (30 + Math.random() * 40) + '%';
  document.body.appendChild(cash);
  setTimeout(() => cash.remove(), 2400);
}

async function main() {
  const params = new URLSearchParams(location.search);
  const recarga = params.get('recarga');
  if (recarga) history.replaceState(null, '', '/app/monedero');

  const res = await fetch('/api/wallet/me');
  const content = document.getElementById('content');
  if (!res.ok) {
    content.innerHTML = '<p class="muted">Necesitas ingresar.</p><a href="/login"><button class="btn-primary">Ingresar con Google</button></a>';
    return;
  }
  const me = await res.json();

  document.getElementById('user-avatar').src = me.avatar_url || '';
  document.getElementById('user-name').textContent = me.name || '';
  document.getElementById('user-chip').style.display = 'flex';
  document.getElementById('btn-logout').onclick = () => { window.location.href = '/auth/logout'; };

  content.innerHTML = `
    <div class="balance-box">
      <div class="label">Tu saldo</div>
      <div class="amount" id="balance-amount">$${(me.balance_cents/100).toFixed(0)}</div>
      <p class="muted">Entrar a una sala cuesta $20 MXN por hora.</p>
      <div class="amount-grid">
        <button data-amt="2000">$20</button>
        <button data-amt="6000">$60</button>
        <button data-amt="12000" class="featured">$120</button>
        <button data-amt="24000">$240</button>
        <button data-amt="48000">$480</button>
        <button data-amt="96000">$960</button>
        <button data-amt="192000" class="wide">$1,920</button>
      </div>
      <p class="muted">Tu saldo sirve para entrar a salas y mandar dinero a creadores.</p>
    </div>
    <div class="balance-box status-box" id="status-box" style="display:none">
      <div class="label">Tu estatus</div>
      <div id="status-content"></div>
    </div>
    <div class="balance-box phrase-box">
      <div class="label">Frase</div>
      <div class="phrase-text" id="phrase-text">…</div>
    </div>
    <div class="balance-box">
      <div class="label">Balance de creador (separado — esto es lo que has ganado)</div>
      <div class="amount green" id="creator-balance-amount">$${(me.creator_balance_cents/100).toFixed(0)}</div>
      ${me.total_retirado_cents > 0 ? `<p class="muted" id="total-retirado" style="margin-top:2px;">💸 Ya has retirado $${Math.round(me.total_retirado_cents/100).toLocaleString('es-MX')} en total</p>` : ''}
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
        ${me.stripe_connect_payouts_enabled
          ? `<button class="btn-navy${me.creator_balance_cents >= me.min_retiro_cents ? ' ready-to-withdraw' : ''}" id="btn-retiro">Retirar a mi banco</button>`
          : '<button class="btn-navy" id="btn-connect">🏦 Conectar cuenta bancaria</button>'}
        <a href="/app/estadisticas"><button class="btn-ghost">Ver mis estadísticas</button></a>
        <a href="/app/transacciones"><button class="btn-ghost">Ver transacciones</button></a>
      </div>
      <p class="muted" style="margin-top:12px;">
        ${me.stripe_connect_payouts_enabled
          ? `Desde $${Math.round(me.min_retiro_cents/100)} MXN — pruébalo con lo que tengas ahorita, llega directo a tu banco vía Stripe. Cada recarga, entrada, propina y retiro queda guardado para siempre — nada se borra.`
          : 'Conecta tu cuenta bancaria una sola vez (lo hace Stripe, nunca vemos tus datos) para poder retirar lo que ganes — desde $' + Math.round(me.min_retiro_cents/100) + ' MXN.'}
      </p>
    </div>
    <div class="balance-box">
      <div class="label">Tu sala</div>
      <div id="room-info">Cargando…</div>
    </div>
    <div class="balance-box" id="integrations-box">
      <div class="label">Integraciones · conecta Video Room con tu sitio o tus herramientas</div>
      <p class="muted" style="margin:4px 0 14px;">Somos un servicio: tu sala se puede leer, escuchar y mostrar desde cualquier otra plataforma. <a class="app-nav-link" href="/app/api">Ver la documentación de la API →</a></p>
      <div id="integrations">Cargando…</div>
    </div>
  `;
  loadPhrase('phrase-text', false);
  loadIntegrations();
  loadStatus();

  // Venimos de Stripe: animamos el saldo subiendo del valor de antes al de ahora.
  if (recarga === 'ok') {
    const before = Number(localStorage.getItem('vr_balance_before') || me.balance_cents);
    localStorage.removeItem('vr_balance_before');
    animateBalance(document.getElementById('balance-amount'), before, me.balance_cents);
    showToast('✅ Recarga exitosa.');
  } else if (recarga === 'cancelada') {
    localStorage.removeItem('vr_balance_before');
    showToast('Recarga cancelada.');
  }

  // Venimos de vuelta del onboarding de Stripe Connect.
  const connect = params.get('connect');
  if (connect) {
    history.replaceState(null, '', '/app/monedero');
    if (connect === 'ok') showToast('✅ Cuenta bancaria conectada. Ya puedes retirar.', 4500);
    else if (connect === 'pendiente') showToast('Casi listo — a Stripe todavía le falta un dato tuyo. Vuelve a intentar "Conectar cuenta".', 5500);
    else if (connect === 'error') showToast('No se pudo conectar tu cuenta. Intenta de nuevo.');
  }

  loadRoom(params.get('bienvenida') === '1');

  content.querySelectorAll('[data-amt]').forEach((btn) => {
    btn.onclick = async () => {
      if (btn.disabled) return;
      btn.disabled = true;
      localStorage.setItem('vr_balance_before', String(me.balance_cents));
      const r = await fetch('/api/wallet/checkout', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ amount_cents: Number(btn.dataset.amt) }) });
      const j = await r.json();
      if (j.url) { window.location.href = j.url; return; }
      localStorage.removeItem('vr_balance_before');
      btn.disabled = false;
      alert('No se pudo iniciar el pago. Intenta de nuevo.');
    };
  });
  const btnRetiro = document.getElementById('btn-retiro');
  if (btnRetiro) {
    btnRetiro.onclick = async () => {
      if (btnRetiro.disabled) return;
      btnRetiro.disabled = true;
      const r = await fetch('/api/wallet/retiro', { method: 'POST' });
      const j = await r.json();
      if (j.error === 'bajo_minimo') alert(`Necesitas al menos $${Math.round((j.minimo_cents ?? me.min_retiro_cents)/100)} en tu balance de creador.`);
      else if (j.error === 'cuenta_no_conectada') alert('Primero conecta tu cuenta bancaria.');
      else if (j.error === 'transferencia_fallida') alert('No se pudo completar la transferencia. Tu saldo sigue intacto — intenta de nuevo en un momento.');
      else if (j.ok) {
        // El momento de cobrar de verdad es una recompensa, no un aviso más:
        // el balance baja animado a $0, una ráfaga de billetes flota sobre la
        // pantalla, vibra en celular, y el mensaje cambia si es su primer
        // retiro de la vida — un hito memorable en vez de un trámite más.
        const esPrimerRetiro = (me.total_retirado_cents || 0) === 0;
        const montoTexto = '$' + Math.round(j.monto_cents / 100).toLocaleString('es-MX');
        animateBalance(document.getElementById('creator-balance-amount'), me.creator_balance_cents, 0, 900);
        for (let i = 0; i < 5; i++) setTimeout(spawnFloatingCash, i * 110);
        if (navigator.vibrate) navigator.vibrate([15, 40, 15]);
        showToast(
          esPrimerRetiro
            ? `🎉 ¡Tu primer retiro, ${montoTexto}! Ya está en camino a tu banco.`
            : `💸 ${montoTexto} van en camino a tu banco.`,
          5000
        );
        document.getElementById('app-toast').classList.add('celebrate');
        setTimeout(() => document.getElementById('app-toast').classList.remove('celebrate'), 5000);
        setTimeout(main, 1600);
        return;
      }
      else alert('No se pudo procesar el retiro. Intenta de nuevo.');
      btnRetiro.disabled = false;
    };
  }
  const btnConnect = document.getElementById('btn-connect');
  if (btnConnect) {
    btnConnect.onclick = async () => {
      if (btnConnect.disabled) return;
      btnConnect.disabled = true;
      const r = await fetch('/api/wallet/connect/start', { method: 'POST' });
      const j = await r.json();
      if (j.url) { window.location.href = j.url; return; }
      if (j.error === 'connect_no_disponible') alert('Los retiros todavía no están disponibles — vuelve a intentar más tarde.');
      else alert('No se pudo iniciar la conexión con tu banco. Intenta de nuevo.');
      btnConnect.disabled = false;
    };
  }
}

async function loadRoom(autoCopy) {
  const el = document.getElementById('room-info');
  const res = await fetch('/api/rooms/mine');
  if (!res.ok) { el.innerHTML = '<p class="muted">No se pudo cargar tu sala.</p>'; return; }
  const room = await res.json();
  renderRoom(room);
  if (autoCopy) {
    const fullUrl = 'https://video.capitaltorreon.com/' + room.slug;
    navigator.clipboard.writeText(fullUrl).then(() => {
      showToast('🔗 Tu link ya está copiado — compártelo cuando quieras.', 4500);
    }).catch(() => {
      // algunos navegadores bloquean el copiado automático; el botón "Copiar link" sigue disponible.
    });
  }
}

function renderRoom(room) {
  const el = document.getElementById('room-info');
  const url = 'video.capitaltorreon.com/' + room.slug;
  setupNavShortcuts(room.slug);
  const ageMsg = room.age_days <= 0
    ? 'La acabas de recibir.'
    : `La tienes desde hace ${room.age_days} día${room.age_days === 1 ? '' : 's'}.`;
  const numericMsg = room.is_numeric
    ? ` Es una URL numérica — entre más antigua, más vale conservarla.`
    : '';
  el.innerHTML = `
    <div class="amount" style="font-size:20px;">${url}</div>
    <p class="muted">${ageMsg}${numericMsg}</p>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
      <a href="/${room.slug}"><button class="btn-primary">🔴 Transmitir en vivo</button></a>
      <button class="btn-ghost" id="btn-copy-link">Copiar link</button>
      <button class="btn-ghost" id="btn-edit-slug">Editar URL</button>
    </div>
    <div id="edit-slug-form" style="display:none; margin-top:14px;">
      <input id="new-slug-input" placeholder="mi-nombre-de-sala" style="width:100%; padding:12px; border-radius:10px; border:.5px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:#fff; margin-bottom:8px; box-sizing:border-box;">
      <div style="display:flex; gap:10px;">
        <button class="btn-navy" id="btn-save-slug">Guardar</button>
        <button class="btn-ghost" id="btn-cancel-slug">Cancelar</button>
      </div>
    </div>
    <div style="margin-top:22px; padding-top:20px; border-top:.5px solid rgba(255,255,255,.08);">
      <div class="label">Cuánto cobras</div>
      <p class="muted" style="margin:4px 0 12px;">Tú decides el precio de tu hora. La plataforma se queda con el 25% (mínimo $10): subir el precio te conviene más a ti que a nosotros.</p>
      <div class="price-grid" id="price-grid">
        ${(room.price_options_cents || [2000]).map((p) => `<button data-price="${p}" class="${p === room.price_cents ? 'active' : ''}"><strong>$${Math.round(p / 100).toLocaleString('es-MX')}</strong><span>te quedas $${Math.round((p - Math.max(1000, Math.round(p * 0.25))) / 100).toLocaleString('es-MX')}</span></button>`).join('')}
      </div>
      <div class="label" style="margin-top:18px;">Membresía mensual <span class="muted" style="font-weight:400">(opcional)</span></div>
      <p class="muted" style="margin:4px 0 12px;">Quien la compre entra todas las veces que quiera durante 30 días sin pagar la hora. Te quedas con el 80%.</p>
      <div class="price-grid" id="membership-grid">
        <button data-membership="0" class="${!room.membership_cents ? 'active' : ''}"><strong>Sin membresía</strong><span>solo por hora</span></button>
        ${(room.membership_options_cents || []).map((p) => `<button data-membership="${p}" class="${p === room.membership_cents ? 'active' : ''}"><strong>$${Math.round(p / 100).toLocaleString('es-MX')}</strong><span>te quedas $${Math.round(p * 0.8 / 100).toLocaleString('es-MX')}</span></button>`).join('')}
      </div>
      <div class="label" style="margin-top:18px;">Meta de propinas por transmisión <span class="muted" style="font-weight:400">(opcional)</span></div>
      <p class="muted" style="margin:4px 0 12px;">Todos ven una barra llenarse en la sala. Una meta visible sube las propinas; vacía la casilla para quitarla.</p>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <span class="muted">$</span>
        <input id="tip-goal" type="number" min="100" max="100000" step="50" inputmode="numeric" value="${room.tip_goal_cents ? Math.round(room.tip_goal_cents / 100) : ''}" placeholder="ej. 500"
          style="width:110px; padding:12px; border-radius:10px; border:.5px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:#fff; box-sizing:border-box;">
        <button class="btn-navy" id="btn-save-goal">Guardar meta</button>
      </div>
    </div>
    <div style="margin-top:22px; padding-top:20px; border-top:.5px solid rgba(255,255,255,.08);">
      <div class="label">Avisar que ya casi empiezas</div>
      <p class="muted" style="margin:4px 0 12px;">
        Tienes <strong style="color:#fff;">${room.notify_count}</strong> persona${room.notify_count === 1 ? '' : 's'} esperando que le${room.notify_count === 1 ? '' : 's'} avises.
      </p>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <input id="starting-minutes" type="number" min="1" max="1440" value="${localStorage.getItem('vr_notify_minutes') || '60'}" inputmode="numeric"
          style="width:90px; padding:12px; border-radius:10px; border:.5px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:#fff; box-sizing:border-box;">
        <span class="muted">minutos</span>
        <button class="btn-primary" id="btn-notify-starting">Avisar que empiezo</button>
      </div>
    </div>
  `;

  document.getElementById('btn-copy-link').onclick = () => {
    navigator.clipboard.writeText('https://' + url);
    showToast('Link copiado.');
  };
  document.getElementById('btn-edit-slug').onclick = () => {
    document.getElementById('edit-slug-form').style.display = 'block';
  };
  document.getElementById('btn-cancel-slug').onclick = () => {
    document.getElementById('edit-slug-form').style.display = 'none';
  };
  const btnSaveSlug = document.getElementById('btn-save-slug');
  btnSaveSlug.onclick = async () => {
    if (btnSaveSlug.disabled) return;
    const newSlug = document.getElementById('new-slug-input').value.trim();
    if (!newSlug) return;
    const warning = room.is_numeric
      ? `Vas a cambiar tu URL numérica "${room.slug}" (la tienes desde hace ${room.age_days} día${room.age_days === 1 ? '' : 's'}) por una personalizada. El número "${room.slug}" quedará libre para que lo tome otro usuario nuevo. ¿Continuar?`
      : `Vas a cambiar tu URL actual "${room.slug}" por "${newSlug}". ¿Continuar?`;
    if (!confirm(warning)) return;
    btnSaveSlug.disabled = true;
    const r = await fetch(`/api/rooms/${room.slug}/rename`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_slug: newSlug }),
    });
    const j = await r.json();
    btnSaveSlug.disabled = false;
    if (j.error === 'slug_ocupado') return alert('Esa URL ya está en uso, prueba con otra.');
    if (j.error === 'slug_numerico_reservado') return alert('Las URLs numéricas las asigna el sistema, elige un nombre con letras.');
    if (j.error === 'slug_reservado') return alert('Ese nombre está reservado, prueba con otro.');
    if (j.error === 'slug_invalido') return alert('Ese nombre no es válido.');
    if (j.error) return alert('No se pudo cambiar la URL.');
    loadRoom(false);
  };

  // Precio, membresía y meta: un toque y queda guardado.
  async function saveSettings(patch, okMsg) {
    const r = await fetch(`/api/rooms/${room.slug}/settings`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
    const j = await r.json();
    if (!j.ok) { alert(j.hint || 'No se pudo guardar.'); return false; }
    showToast(okMsg, 3500);
    return true;
  }
  document.querySelectorAll('#price-grid button').forEach((b) => b.onclick = async () => {
    const price = Number(b.dataset.price);
    if (await saveSettings({ price_cents: price }, `✅ Tu hora ahora cuesta $${Math.round(price / 100)}. Te quedas con $${Math.round((price - Math.max(1000, Math.round(price * 0.25))) / 100)}.`)) {
      document.querySelectorAll('#price-grid button').forEach((x) => x.classList.toggle('active', x === b)); room.price_cents = price;
    }
  });
  document.querySelectorAll('#membership-grid button').forEach((b) => b.onclick = async () => {
    const m = Number(b.dataset.membership) || null;
    if (await saveSettings({ membership_cents: m }, m ? `✅ Membresía mensual a $${Math.round(m / 100)}. Te quedas con $${Math.round(m * 0.8 / 100)} por cada una.` : 'Membresía desactivada.')) {
      document.querySelectorAll('#membership-grid button').forEach((x) => x.classList.toggle('active', x === b)); room.membership_cents = m;
    }
  });
  document.getElementById('btn-save-goal').onclick = async () => {
    const v = document.getElementById('tip-goal').value.trim();
    const goal = v === '' ? null : Math.round(Number(v)) * 100;
    if (goal !== null && (!(goal >= 10000) || goal > 10000000)) return alert('La meta va entre $100 y $100,000.');
    await saveSettings({ tip_goal_cents: goal }, goal ? `🎯 Meta de $${Math.round(goal / 100)} por transmisión.` : 'Meta quitada.');
  };

  const btnNotifyStarting = document.getElementById('btn-notify-starting');
  btnNotifyStarting.onclick = async () => {
    if (btnNotifyStarting.disabled) return;
    const minutes = parseInt(document.getElementById('starting-minutes').value, 10);
    if (!Number.isInteger(minutes) || minutes < 1 || minutes > 1440) {
      alert('Pon un número de minutos válido (1 a 1440).');
      return;
    }
    localStorage.setItem('vr_notify_minutes', String(minutes));
    btnNotifyStarting.disabled = true;
    const r = await fetch(`/api/rooms/${room.slug}/notify-starting`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ minutes }),
    });
    const j = await r.json();
    btnNotifyStarting.disabled = false;
    if (j.ok) showToast(`✅ Avisamos a ${j.count} persona${j.count === 1 ? '' : 's'} que empiezas en ${minutes} min.`, 5000);
    else alert('No se pudo enviar el aviso.');
  };
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// ---------- Estatus: rango como creador / espectador y reliquias ----------
// Elegante a propósito: el rango actual grande, una barra fina hacia el
// siguiente, las reliquias ganadas en color y SOLO las tres siguientes en
// gris con una línea de cómo se ganan. Nada de puntos ni rachas.
async function loadStatus() {
  const res = await fetch('/api/status/me');
  if (!res.ok) return;
  const s = await res.json();
  const box = document.getElementById('status-box');
  const hoursLeft = (r) => r.next ? Math.max(0, Math.ceil(r.next.hours - r.hours)) : 0;
  const rank = (r, unit) => `
    <div>
      <div class="status-rank">
        <span class="status-name">${escapeHtml(r.rank.name)}${r.rank.mark ? ` <span style="color:#F5C542;font-size:16px;">${r.rank.mark}</span>` : ''}</span>
        <span class="status-meta">${r.hours} h ${unit}</span>
      </div>
      <div class="status-track"><div style="width:${Math.round((r.next ? r.progress : 1) * 100)}%"></div></div>
      <div class="status-meta">${r.next ? `${hoursLeft(r)} h más para <strong style="color:#fff;">${escapeHtml(r.next.name)}</strong>` : 'El rango más alto. Gracias por estar aquí.'}</div>
    </div>`;
  const relicCard = (r, earned) => `
    <div class="relic-card ${earned ? 'earned' : 'pending'}" title="${escapeHtml(r.how)}">
      <span class="relic">${r.icon}</span>
      <div><div class="relic-name">${escapeHtml(r.name)}</div><div class="relic-how">${earned ? 'Ganada el ' + new Date(r.earned_at * 1000).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) : escapeHtml(r.how)}</div></div>
    </div>`;
  document.getElementById('status-content').innerHTML = `
    <div class="status-two">${rank(s.creator, 'en vivo')}${rank(s.viewer, 'viendo a otros')}</div>
    ${(s.relics.length || s.next_relics.length) ? `<div class="relic-shelf">${s.relics.map((r) => relicCard(r, true)).join('')}${s.next_relics.map((r) => relicCard(r, false)).join('')}</div>` : ''}
  `;
  box.style.display = 'block';
}

// ---------- Integraciones: badge embebible, llaves de API y webhooks ----------
// Todo lo que un tercero necesita para usarnos como servicio vive aquí, en
// el mismo monedero, sin salir a otra página (la documentación es el único
// link afuera, y es pública).
let roomSlugForIntegrations = null;
async function loadIntegrations() {
  const el = document.getElementById('integrations');
  const [keysRes, hooksRes, roomRes] = await Promise.all([
    fetch('/api/integrations/keys'), fetch('/api/v1/webhooks'), fetch('/api/rooms/mine'),
  ]);
  if (!keysRes.ok || !hooksRes.ok) { el.innerHTML = '<p class="muted">No se pudieron cargar las integraciones.</p>'; return; }
  const keys = (await keysRes.json()).keys || [];
  const hooks = await hooksRes.json();
  roomSlugForIntegrations = roomRes.ok ? (await roomRes.json()).slug : null;
  const origin = location.origin;
  const embed = `<script src="${origin}/embed.js" data-room="${roomSlugForIntegrations || 'tu-sala'}"><\/script>`;
  const fecha = (ts) => ts ? new Date(ts * 1000).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) : '—';

  el.innerHTML = `
    <div class="int-section">
      <div class="int-title">1 · Botón «En vivo» para tu sitio</div>
      <p class="muted">Pega esta línea en tu página web, blog o Notion y aparece un botón que dice si estás en vivo y cuánta gente hay. Se actualiza solo.</p>
      <div class="code-box"><code id="embed-code">${escapeHtml(embed)}</code><button class="btn-ghost small" id="btn-copy-embed">Copiar</button></div>
      <div id="embed-preview" style="margin-top:10px;"></div>
    </div>
    <div class="int-section">
      <div class="int-title">2 · Llaves de API</div>
      <p class="muted">Con una llave, otra plataforma puede leer tu sala, tus estadísticas y tus transacciones, o avisar que empiezas. La llave completa se enseña una sola vez.</p>
      <div id="keys-list">${keys.length ? keys.map((k) => `
        <div class="int-row">
          <div class="int-row-main"><strong>${escapeHtml(k.name)}</strong><span class="muted mono">${escapeHtml(k.prefix)}…</span></div>
          <span class="muted">creada ${fecha(k.created_at)} · último uso ${fecha(k.last_used_at)}</span>
          <button class="btn-ghost small danger" data-revoke="${escapeHtml(k.id)}">Revocar</button>
        </div>`).join('') : '<p class="muted">Todavía no tienes llaves.</p>'}</div>
      <div class="int-form">
        <input id="key-name" placeholder="Nombre (ej. Mi sitio WordPress)" maxlength="60">
        <button class="btn-navy" id="btn-new-key">Crear llave</button>
      </div>
      <div id="new-key-out"></div>
    </div>
    <div class="int-section">
      <div class="int-title">3 · Webhooks</div>
      <p class="muted">Te avisamos a una URL tuya cada vez que pasa algo: empiezas a transmitir, entra alguien, recibes propina, te siguen, recargas, retiras. Cada aviso va firmado.</p>
      <div id="hooks-list">${hooks.webhooks.length ? hooks.webhooks.map((h) => `
        <div class="int-row">
          <div class="int-row-main"><span class="mono">${escapeHtml(h.url)}</span><span class="muted">${h.events.join(', ')}</span></div>
          <span class="muted">${h.last_status ? (h.last_error ? '⚠️ ' + escapeHtml(h.last_error) : '✅ ' + h.last_status) : 'sin entregas'}</span>
          <button class="btn-ghost small" data-test="${escapeHtml(h.id)}">Probar</button>
          <button class="btn-ghost small danger" data-del="${escapeHtml(h.id)}">Quitar</button>
        </div>`).join('') : '<p class="muted">Todavía no tienes webhooks.</p>'}</div>
      <div class="int-form">
        <input id="hook-url" placeholder="https://tusitio.com/videoroom" inputmode="url">
        <button class="btn-navy" id="btn-new-hook">Agregar webhook</button>
      </div>
      <div class="int-events">${hooks.events.filter((e) => e !== 'ping').map((e) => `<label><input type="checkbox" name="hook-ev" value="${e}" checked> ${e}</label>`).join('')}</div>
      <div id="new-hook-out"></div>
    </div>
  `;

  // Vista previa real del badge: el mismo script que pegaría el tercero.
  if (roomSlugForIntegrations) {
    const s = document.createElement('script');
    s.src = '/embed.js'; s.setAttribute('data-room', roomSlugForIntegrations);
    document.getElementById('embed-preview').appendChild(s);
  }
  document.getElementById('btn-copy-embed').onclick = () => { navigator.clipboard.writeText(embed); showToast('Código copiado.'); };

  document.getElementById('btn-new-key').onclick = async () => {
    const name = document.getElementById('key-name').value.trim();
    const r = await fetch('/api/integrations/keys', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
    const j = await r.json();
    if (!r.ok) return alert(j.error === 'too_many' ? 'Máximo 10 llaves. Revoca alguna primero.' : 'No se pudo crear la llave.');
    document.getElementById('new-key-out').innerHTML = `
      <div class="secret-box">
        <div class="label">Tu llave nueva — cópiala ahora, no se vuelve a mostrar</div>
        <div class="code-box"><code>${escapeHtml(j.key)}</code><button class="btn-ghost small" id="btn-copy-key">Copiar</button></div>
        <p class="muted">Úsala como <span class="mono">Authorization: Bearer ${escapeHtml(j.prefix)}…</span></p>
      </div>`;
    document.getElementById('btn-copy-key').onclick = () => { navigator.clipboard.writeText(j.key); showToast('Llave copiada.'); };
    const list = document.getElementById('keys-list');
    if (list.querySelector('p')) list.innerHTML = '';
    list.insertAdjacentHTML('afterbegin', `<div class="int-row"><div class="int-row-main"><strong>${escapeHtml(name || 'Mi integración')}</strong><span class="muted mono">${escapeHtml(j.prefix)}…</span></div><span class="muted">recién creada</span><button class="btn-ghost small danger" data-revoke="${escapeHtml(j.id)}">Revocar</button></div>`);
    document.getElementById('key-name').value = '';
  };

  document.getElementById('btn-new-hook').onclick = async () => {
    const url = document.getElementById('hook-url').value.trim();
    if (!/^https:\/\//i.test(url)) return alert('La URL debe empezar con https://');
    const events = [...document.querySelectorAll('input[name="hook-ev"]:checked')].map((i) => i.value);
    if (!events.length) return alert('Elige al menos un evento.');
    const r = await fetch('/api/v1/webhooks', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url, events }) });
    const j = await r.json();
    if (!r.ok) return alert(j.error === 'too_many' ? 'Máximo 10 webhooks.' : 'No se pudo agregar el webhook.');
    document.getElementById('new-hook-out').innerHTML = `
      <div class="secret-box">
        <div class="label">Secreto para verificar la firma — cópialo ahora, no se vuelve a mostrar</div>
        <div class="code-box"><code>${escapeHtml(j.secret)}</code><button class="btn-ghost small" id="btn-copy-whsec">Copiar</button></div>
        <p class="muted">Cada aviso trae <span class="mono">X-VideoRoom-Signature: t=…,v1=HMAC-SHA256(secreto, t + "." + cuerpo)</span>. Cómo verificarla está en la documentación.</p>
      </div>`;
    document.getElementById('btn-copy-whsec').onclick = () => { navigator.clipboard.writeText(j.secret); showToast('Secreto copiado.'); };
    showToast('✅ Webhook agregado. Tócale «Probar» para mandar un ping.', 4500);
    setTimeout(loadIntegrations, 1200);
  };

  el.querySelectorAll('[data-revoke]').forEach((b) => b.onclick = async () => {
    if (!confirm('¿Revocar esta llave? Lo que la use dejará de funcionar al instante.')) return;
    await fetch(`/api/integrations/keys/${b.dataset.revoke}`, { method: 'DELETE' });
    loadIntegrations();
  });
  el.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    if (!confirm('¿Quitar este webhook?')) return;
    await fetch(`/api/v1/webhooks/${b.dataset.del}`, { method: 'DELETE' });
    loadIntegrations();
  });
  el.querySelectorAll('[data-test]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    const r = await fetch(`/api/v1/webhooks/${b.dataset.test}/test`, { method: 'POST' });
    const j = await r.json();
    showToast(j.ok ? `✅ Tu servidor respondió ${j.status}.` : `⚠️ Falló: ${j.error || 'sin respuesta'}`, 5000);
    b.disabled = false;
    loadIntegrations();
  });
}

let notifData = { unread_count: 0, items: [] };

async function loadNotifications() {
  const res = await fetch('/api/notifications');
  if (!res.ok) return;
  notifData = await res.json();
  document.getElementById('bell-wrap').style.display = 'flex';
  document.getElementById('bell-badge').classList.toggle('show', notifData.unread_count > 0);
}

function renderNotifDropdown() {
  const el = document.getElementById('bell-dropdown');
  if (!notifData.items.length) {
    el.innerHTML = '<div class="bell-empty">Aquí van a aparecer avisos cuando las salas que sigues se pongan en vivo.</div>';
    return;
  }
  el.innerHTML = notifData.items.map((n) => `
    <a class="bell-item bell-item-notif" href="/${encodeURIComponent(n.room_slug)}">
      ${n.creator_avatar ? `<img class="bell-item-avatar" src="${escapeHtml(n.creator_avatar)}">` : '<div class="bell-item-avatar"></div>'}
      <div class="bell-item-text">
        <div class="t">${escapeHtml(n.title)}</div>
        <div class="b">${escapeHtml(n.body)}</div>
      </div>
    </a>`).join('');
}

document.getElementById('btn-bell').onclick = async () => {
  const dropdown = document.getElementById('bell-dropdown');
  if (dropdown.classList.contains('show')) { dropdown.classList.remove('show'); return; }
  renderNotifDropdown();
  dropdown.classList.add('show');
  if (notifData.unread_count > 0) {
    await fetch('/api/notifications/read', { method: 'POST' });
    document.getElementById('bell-badge').classList.remove('show');
    notifData.unread_count = 0;
  }
};

// Transmitir y copiar link son las dos acciones que un creador necesita a la
// mano en todo momento — antes vivían enterradas en la tarjeta de "Tu sala"
// y había que bajar a buscarlas. Ahora quedan fijas en la barra de arriba.
function setupNavShortcuts(slug) {
  const fullUrl = 'https://video.capitaltorreon.com/' + slug;
  const transmitBtn = document.getElementById('btn-transmit-nav');
  transmitBtn.href = '/' + slug;
  transmitBtn.style.display = 'inline-block';
  const copyBtn = document.getElementById('btn-copy-link-nav');
  copyBtn.style.display = 'flex';
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(fullUrl);
    showToast('🔗 Link copiado.');
  };
}

// Frase del día: la misma para todos, cambia sola cada 24h a las 3:33pm CDMX
// (21:33 UTC — México ya no usa horario de verano). Si la pestaña sigue
// abierta cuando llega ese momento, la nueva frase entra deslizándose.
function nextPhraseBoundaryMs(fromMs) {
  const d = new Date(fromMs);
  let boundary = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 21, 33, 0);
  if (boundary <= fromMs) boundary += 24 * 60 * 60 * 1000;
  return boundary;
}
async function loadPhrase(elId, animate) {
  const el = document.getElementById(elId);
  if (!el) return;
  try {
    const res = await fetch('/api/phrase');
    if (!res.ok) return;
    const { text } = await res.json();
    el.textContent = text;
    if (animate) {
      el.classList.remove('sliding');
      void el.offsetWidth;
      el.classList.add('sliding');
    }
  } catch {}
}
function schedulePhraseRefresh(elId) {
  const delay = nextPhraseBoundaryMs(Date.now()) - Date.now() + 500;
  setTimeout(() => { loadPhrase(elId, true); schedulePhraseRefresh(elId); }, delay);
}

loadNotifications();
setInterval(loadNotifications, 30000);
// Datos frescos (veloz.js): la página se pintó al instante con una copia
// precargada; si la versión real difiere, se repinta solo ese bloque. La
// lectura sale de la copia ya verificada, sin otra petición.
window.addEventListener('vr:fresco', (e) => {
  const u = e.detail.url;
  if (u.startsWith('/api/wallet/me')) refrescarSaldos();
  else if (u.startsWith('/api/rooms/mine')) loadRoom(false);
  else if (u.startsWith('/api/status/me')) loadStatus();
  else if (u.startsWith('/api/notifications')) loadNotifications();
  else if (u.startsWith('/api/phrase')) loadPhrase('phrase-text', true);
});
async function refrescarSaldos() {
  const r = await fetch('/api/wallet/me');
  if (!r.ok) return;
  const me = await r.json();
  const b = document.getElementById('balance-amount');
  if (b) b.textContent = '$' + (me.balance_cents / 100).toFixed(0);
  const cb = document.getElementById('creator-balance-amount');
  if (cb) cb.textContent = '$' + (me.creator_balance_cents / 100).toFixed(0);
  document.getElementById('user-name').textContent = me.name || '';
  document.getElementById('user-avatar').src = me.avatar_url || '';
}

main();
schedulePhraseRefresh('phrase-text');
